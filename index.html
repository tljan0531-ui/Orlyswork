<style>
:root {
  --paper:#EFEBDF;

  --clay:#C37C61;
  --ink:#393A3A;
  --muted:#77786F;
  --line:#ded8ca;
}
* { box-sizing:border-box; }
body {
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;
  line-height:1.65;
}
.wrap { max-width:1080px;width:92%;margin:auto; }
.hero {
  margin:18px auto 24px;
  border-radius:24px;
  overflow:hidden;
  min-height:260px;
  display:flex;
  align-items:end;
  padding:28px;
  color:white;
  background:linear-gradient(0deg,#20251fdd,#20251f22),
  url("https://images.unsplash.com/photo-1503899036084-c55cdd92da26?w=1200") center/cover;
}
.eyebrow { letter-spacing:.16em;font-size:12px; }
.hero h1 { font-family:Georgia,serif;font-size:clamp(32px,7vw,54px);margin:8px 0; }
.hero p { margin:4px 0;color:#f5f1e9; }
h2 { font-family:Georgia,"Noto Serif TC",serif;margin:22px 0 8px; }
.muted { color:var(--muted);font-size:14px; }
.nav,.days {
  display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;
}
button {
  font:inherit;cursor:pointer;
  white-space:nowrap;border:1px solid var(--line);
  background:var(--cream);color:var(--ink);
  border-radius:999px;padding:10px 16px;font-size:14px;
}
button.active { background:var(--sage);color:white;border-color:var(--sage); }
.panel {
  background:var(--cream);border:1px solid var(--line);
  border-radius:18px;padding:18px;margin:14px 0;
}
.dayhead {
  display:flex;justify-content:space-between;
  gap:12px;align-items:end;flex-wrap:wrap;
}
.pill {
  display:inline-block;background:#e5e9df;color:#53664f;
  border-radius:999px;padding:4px 10px;font-size:12px;
}
.grid {
  display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;
}
.place {
  background:white;border:1px solid var(--line);
  border-radius:16px;overflow:hidden;
}
.place img,.hotel img {
  width:100%;height:160px;object-fit:cover;display:block;background:#e6e0d3;
}
.placebody { padding:13px; }
.place h3,.hotel h3 { margin:2px 0 6px;font-size:17px; }
.place p,.hotel p { font-size:13px;color:var(--muted);margin:5px 0 10px; }
.links { display:flex;gap:14px;flex-wrap:wrap;font-size:13px; }
.links a { color:#477d85;text-decoration:none;font-weight:600; }
.event {
  display:grid;grid-template-columns:70px 1fr;gap:12px;
  padding:12px 0;border-bottom:1px solid var(--line);
}
.event:last-child { border:0; }
.time { color:var(--sage);font-weight:700; }
.route {
  background:white;border-radius:14px;padding:14px;
  margin:12px 0;border:1px solid var(--line);
}
.route h3 { font-size:16px;margin:0 0 5px; }
.pros { color:#536e52; }
.cons { color:#a45e48; }
.weatherbig { font-size:40px; }
.weathergrid {
  display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;
}
.weathercell { background:white;border-radius:12px;padding:12px; }
.weathercell b { display:block;font-size:20px; }
.hotel {
  display:grid;grid-template-columns:180px 1fr;gap:15px;
  background:white;border:1px solid var(--line);
  border-radius:16px;padding:12px;margin:12px 0;
}
.hotel img { height:150px;border-radius:11px; }
.notice {
  background:#f5e8df;border-left:4px solid var(--clay);
  padding:12px 14px;border-radius:8px;font-size:14px;
}
footer { text-align:center;color:var(--muted);font-size:12px;padding:35px 10px; }
@media(max-width:560px) {
  .hotel { grid-template-columns:1fr; }
  .hotel img { height:180px; }
  .hero { min-height:220px;padding:20px; }
  .panel { padding:14px; }
  .event { grid-template-columns:60px 1fr; }
}
</style>
</head>

// 3. Google Maps
// ===================================

function maps(q) {
  return "https://www.google.com/maps/search/?api=1&query=" +
    encodeURIComponent(q + " 日本");
}

// ===================================
// 4. 每日按鈕與頁籤
// ===================================

let current = 0;
let tab = "itinerary";

function renderDays() {
  document.getElementById("days").innerHTML =
    days.map((d,i) => `
      <button class="${i===0?'active':''}" data-day="${i}">
        DAY ${i+1}<br>${d.date.slice(0,5)}
      </button>
    `).join("");

  document.querySelectorAll("[data-day]").forEach(b => {
    b.onclick = () => selectDay(Number(b.dataset.day));
  });
}

function selectDay(i) {
  current = i;
  document.querySelectorAll("[data-day]").forEach(b => {
    b.classList.toggle("active", Number(b.dataset.day) === i);
  });
  render();
}

document.querySelectorAll("[data-tab]").forEach(b => {
  b.onclick = () => {
    tab = b.dataset.tab;
    document.querySelectorAll("[data-tab]").forEach(x => {
      x.classList.toggle("active", x === b);
    });
    render();
  };
});

// ===================================
// 5. 顯示每日內容
// ===================================

function render() {
  const d = days[current];

  document.getElementById("dayTitle").textContent =
    `DAY ${current+1}｜${d.city}`;

  document.getElementById("daySub").textContent =
    `${d.date} · ${d.place}`;

  const c = document.getElementById("content");

  if (tab === "itinerary") {
    c.innerHTML = `
      <div class="panel">
        ${d.events.map(e => `
          <div class="event">
            <div class="time">${e[0]}</div>
            <div>
              <b>${e[1]}</b>
              <div class="muted">${e[3]}</div>
              <div class="links">
                <a target="_blank" rel="noopener" href="${maps(e[2])}">
                  📍 Google Maps 導航 ↗
                </a>
              </div>
            </div>
          </div>
        `).join("")}
      </div>

      <h2>今日景點照片</h2>
      <div class="grid">
        ${d.events.filter(e => attractions[e[2]]).map(e => {
          const a = attractions[e[2]];
          return `
            <article class="place">
              <img loading="lazy" src="${a[0]}" alt="${e[2]}"
                onerror="this.style.display='none'">
              <div class="placebody">
                <h3>${e[2]}</h3>
                <p>${a[1]}</p>
                <div class="links">
                  <a target="_blank" rel="noopener" href="${maps(e[2])}">Google Maps ↗</a>
                </div>
              </div>
            </article>
          `;
        }).join("")}
      </div>
    `;
  }

  if (tab === "transport") {
    c.innerHTML = `
      <h2>交通方式比較</h2>
      ${d.routes.map((r,i) => `
        <div class="route">
          <span class="pill">方案 ${i+1}</span>
          <h3>${r[0]}</h3>
          <b>${r[1]}</b>
          <p>預估車程：${r[2]}</p>
          <p class="pros">優點：${r[3]}</p>
          <p class="cons">注意事項：${r[4]}</p>
          <a target="_blank" rel="noopener" href="${maps(r[0])}">查看路線地圖 ↗</a>
        </div>
      `).join("")}
      <p class="muted">
        車程為規劃估算，請於出發前以鐵道／巴士官方時刻表確認實際班次與票價。
      </p>
    `;
  }

  if (tab === "weather") {
    c.innerHTML = `
      <div class="panel">
        <div class="weatherbig">🌦️</div>
        <h3>${d.place}｜${d.date} 天氣預報</h3>
        <div id="weatherResult" class="muted">正在讀取 Open-Meteo 天氣資料…</div>
        <p class="muted">天氣預報會隨時間更新；距離出發較遠時，預報可能尚未涵蓋該日期。</p>
      </div>
    `;
    loadWeather(d);
  }
}

// ===================================
// 6. 天氣 API
// ===================================

async function loadWeather(d) {
  const box = document.getElementById("weatherResult");

  try {
    const url =
      `https://api.open-meteo.com/v1/forecast?latitude=${d.lat}&longitude=${d.lon}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FTokyo&forecast_days=16`;

    const res = await fetch(url);
    if (!res.ok) throw new Error("天氣服務暫時無法連線");

    const j = await res.json();

    const month = d.date.match(/(\d+)\/\d+/)[1].padStart(2,"0");
    const dayNum = d.date.match(/\d+\/(\d+)/)[1].padStart(2,"0");
    const date = `2026-${month}-${dayNum}`;
    const i = j.daily.time.indexOf(date);

    if (i < 0) {
      throw new Error("目前預報尚未涵蓋這一天，請接近出發日期再查看。");
    }

    const code = j.daily.weather_code[i];

    box.innerHTML = `
      <div class="weathergrid">
        <div class="weathercell"><span>${weatherIcon(code)} 天氣</span><b>${weatherText(code)}</b></div>
        <div class="weathercell"><span>最高溫</span><b>${Math.round(j.daily.temperature_2m_max[i])}°C</b></div>
        <div class="weathercell"><span>最低溫</span><b>${Math.round(j.daily.temperature_2m_min[i])}°C</b></div>
        <div class="weathercell"><span>降雨機率</span><b>${j.daily.precipitation_probability_max?.[i] ?? "—"}%</b></div>
      </div>
      <p class="muted">資料日期：${date}（日本時間）</p>
    `;
  } catch(e) {
    box.textContent = e.message + " 可先查看日本氣象廳預報。";
    box.innerHTML += `
      <p><a target="_blank" rel="noopener" href="https://www.jma.go.jp/bosai/forecast/">
        日本氣象廳天氣預報 ↗
      </a></p>
    `;
  }
}

function weatherText(c) {
  if(c===0) return "晴朗";
  if([1,2].includes(c)) return "晴時多雲";
  if(c===3) return "陰天";
  if([45,48].includes(c)) return "有霧";
  if([51,53,55,56,57].includes(c)) return "毛毛雨";
  if([61,63,65,66,67,80,81,82].includes(c)) return "有雨";
  if([71,73,75,77,85,86].includes(c)) return "降雪";
  if([95,96,99].includes(c)) return "雷雨";
  return "天氣變化";
}

function weatherIcon(c) {
  if(c===0) return "☀️";
  if([1,2].includes(c)) return "🌤️";
  if(c===3) return "☁️";
  if([45,48].includes(c)) return "🌫️";
  if([71,73,75,77,85,86].includes(c)) return "❄️";
  if([95,96,99].includes(c)) return "⛈️";
  if([51,53,55,56,57,61,63,65,66,67,80,81,82].includes(c)) return "🌧️";
  return "🌥️";
}
