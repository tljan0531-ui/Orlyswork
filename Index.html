
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>北陸・秋日旅行</title>

<style>
:root {
  --paper: #EFEBDF;
  --cream: #F8F6F0;
  --sage: #7C8D79;
  --clay: #C37C61;
  --ink: #393A3A;
  --muted: #77786F;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: Arial, "Noto Sans TC", sans-serif;
  line-height: 1.7;
}

.container {
  width: 92%;
  max-width: 1000px;
  margin: auto;
}

header {
  padding: 35px 25px;
  margin: 20px auto;
  border-radius: 22px;
  color: white;
  background:
    linear-gradient(90deg, #393A3ADD, #393A3A55),
    url("https://images.unsplash.com/photo-1503899036084-c55cdd92da26?w=1200")
    center/cover;
}

header h1 {
  font-size: 38px;
  margin-bottom: 5px;
}

header p { color: #eee; }

h2 {
  font-family: Georgia, serif;
}

.day-buttons {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin: 20px 0;
}

button {
  padding: 12px 8px;
  border: 1px solid #ddd7c9;
  border-radius: 12px;
  background: var(--cream);
  color: var(--ink);
  font-size: 14px;
  cursor: pointer;
}

button.active {
  background: var(--sage);
  color: white;
}

.tabs {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin: 20px 0;
}

.tabs button {
  border-radius: 30px;
  padding: 10px 18px;
}

.card {
  background: var(--cream);
  padding: 20px;
  margin-bottom: 15px;
  border-radius: 18px;
  border: 1px solid #ddd7c9;
}

.event {
  padding: 15px 0;
  border-bottom: 1px solid #ddd7c9;
}

.event:last-child { border: none; }

.time {
  color: var(--sage);
  font-weight: bold;
}

a {
  color: #477D85;
  text-decoration: none;
  font-weight: bold;
}

.route {
  background: white;
  padding: 15px;
  border-radius: 12px;
  margin: 12px 0;
}

.good { color: var(--sage); }
.bad { color: #B36F55; }

.weather-icon {
  font-size: 45px;
}

footer {
  text-align: center;
  padding: 30px;
  color: var(--muted);
}

@media (min-width: 700px) {
  .day-buttons {
    grid-template-columns: repeat(8, 1fr);
  }
}
</style>
</head>

<body>

<div class="container">

<header>
  <p>TRAVEL JOURNAL · JAPAN</p>
  <h1>北陸・秋日旅行</h1>
  <p>沿著鐵道，走進山海與秋色。</p>
  <p>2026.11.05 — 11.12 ｜ 8 DAYS 7 NIGHTS</p>
</header>

<h2>旅程安排</h2>
<p>選擇日期，查看每日行程、天氣與交通。</p>

<div class="day-buttons" id="dayButtons"></div>

<h2 id="dayTitle"></h2>
<p id="dayCity"></p>

<div class="tabs">
  <button onclick="showTab('itinerary')" id="tab-itinerary" class="active">每日行程</button>
  <button onclick="showTab('weather')" id="tab-weather">天氣資訊</button>
  <button onclick="showTab('transport')" id="tab-transport">交通比較</button>
</div>

<div id="content"></div>

</div>

<footer>
  HOKURIKU TRAVEL JOURNAL · 2026
</footer>

],
routes:[

// Google 地圖連結
function mapLink(place) {
  return "https://www.google.com/maps/search/?api=1&query="
    + encodeURIComponent(place + " 日本");
}

// 建立每日按鈕
function createButtons() {
  const box = document.getElementById("dayButtons");
  box.innerHTML = "";

  days.forEach((day, i) => {
    const btn = document.createElement("button");
    btn.innerHTML = "DAY " + (i+1) + "<br>" + day.date;
    btn.onclick = () => selectDay(i);
    if (i === 0) btn.classList.add("active");
    box.appendChild(btn);
  });
}

// 選擇日期
let currentDay = 0;
let currentTab = "itinerary";

function selectDay(index) {
  currentDay = index;
  createButtons();

  document.querySelectorAll(".day-buttons button")
    .forEach((btn, i) => {
      btn.classList.toggle("active", i === index);
    });

  render();
}

// 切換資訊
function showTab(tab) {
  currentTab = tab;

  document.querySelectorAll(".tabs button")
    .forEach(btn => btn.classList.remove("active"));

  document.getElementById("tab-" + tab)
    .classList.add("active");

  render();
}

// 顯示內容
function render() {
  const day = days[currentDay];

  document.getElementById("dayTitle").innerText =
    "DAY " + (currentDay+1) + "｜" + day.title;

  document.getElementById("dayCity").innerText =
    day.date + " ・ " + day.city;

  const content = document.getElementById("content");

  if (currentTab === "itinerary") {
    content.innerHTML = `
      <div class="card">
        <h2>今日行程</h2>
        ${day.events.map(e => `
          <div class="event">
            <span class="time">${e[0]}</span>
            <h3>${e[1]}</h3>
            <a href="${mapLink(e[2])}" target="_blank">
              📍 Google Maps 地圖導航 ↗
            </a>
          </div>
        `).join("")}
      </div>
    `;
  }

  if (currentTab === "transport") {
    content.innerHTML = `
      <div class="card">
        <h2>交通方式比較</h2>
        ${day.routes.map(r => `
          <div class="route">
            <h3>${r[0]}</h3>
            <p><b>方案：</b>${r[1]}</p>
            <p><b>車程：</b>${r[2]}</p>
            <p class="good"><b>優點：</b>${r[3]}</p>
            <p class="bad"><b>缺點：</b>${r[4]}</p>
            <a href="${mapLink(r[0])}" target="_blank">
              查看 Google Maps ↗
            </a>
          </div>
        `).join("")}
      </div>
    `;
  }

  if (currentTab === "weather") {
    content.innerHTML = `
      <div class="card">
        <h2>每日天氣｜${day.city}</h2>
        <div class="weather-icon">🌤️</div>
        <p>預計旅行日期：2026 年 ${day.date}</p>
        <p>天氣資料將透過 Open-Meteo API 取得。</p>
        <p>目前先提供天氣資訊區塊，尚未載入即時預報。</p>
        <a href="https://www.jma.go.jp/bosai/forecast/" target="_blank">
          日本氣象廳天氣預報 ↗
        </a>
      </div>
    `;
  }
}

// 啟動網站
createButtons();
render();

</script>

</body>
</html>
